name: Deploy do Supabase (banco e Edge Function)

# Aplica as migrations do banco e publica a Edge Function "djen-sync" sempre
# que algo dentro de supabase/** mudar na main, ou manualmente via
# workflow_dispatch (útil para reaplicar sem precisar de um novo commit).

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
  workflow_dispatch: {}

jobs:
  deploy:
    # Só roda depois que a variável SUPABASE_PROJECT_REF e os secrets
    # SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD forem configurados no repositório.
    if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências (supabase CLI via npx)
        run: npm ci

      - name: Vincular ao projeto Supabase
        run: npx supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Aplicar migrations no banco
        run: npx supabase db push

      - name: Publicar a Edge Function djen-sync
        run: npx supabase functions deploy djen-sync --use-api
